spring:
  application:
    name: ticket-api
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
